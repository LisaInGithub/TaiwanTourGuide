<style>
:root {
  --bg: #f6f7f4;
  --card: #ffffff;
  --text: #1f2a2a;
  --muted: #5d6b6b;
  --line: #e2e6e2;
  --primary: #0f766e;
  --primary-soft: #d9f0ec;
  --accent: #e2583e;
  --chip: #eef2ef;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716;
    --card: #1a2221;
    --text: #e7eeec;
    --muted: #9aaaa7;
    --line: #2b3533;
    --primary: #3cbfae;
    --primary-soft: #16332f;
    --accent: #ff7b61;
    --chip: #232d2b;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716;
  --card: #1a2221;
  --text: #e7eeec;
  --muted: #9aaaa7;
  --line: #2b3533;
  --primary: #3cbfae;
  --primary-soft: #16332f;
  --accent: #ff7b61;
  --chip: #232d2b;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: baseline; gap: 10px;
  padding: 12px 16px;
  background: var(--primary); color: #fff;
}
.brand { font-weight: 700; font-size: 1.15rem; }
.subtitle { opacity: 0.8; font-size: 0.8rem; }

main { max-width: 760px; margin: 0 auto; padding: 16px; }

h2 { font-size: 1.15rem; margin: 20px 0 10px; }
h3 { font-size: 1rem; margin: 0 0 4px; }
.muted { color: var(--muted); font-size: 0.88rem; }
.small { font-size: 0.8rem; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grid .card { margin: 0; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }

label.field { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
select, input[type="text"], input[type="number"] {
  width: 100%; font: inherit; color: var(--text);
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}

button { font: inherit; cursor: pointer; }
.btn {
  border: 0; border-radius: 10px; padding: 10px 16px;
  background: var(--primary); color: #fff; font-weight: 600;
}
.btn.ghost { background: var(--primary-soft); color: var(--primary); }
.btn.small { padding: 6px 10px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.icon-btn { background: none; border: 0; font-size: 1.2rem; padding: 4px; line-height: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--chip); color: var(--text);
  border-radius: 999px; padding: 6px 12px; font-size: 0.88rem;
}
.chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.tag { display: inline-block; font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); margin: 2px 4px 0 0; }

/* 問導遊 */
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px 0; }
.bubble { padding: 10px 12px; border-radius: 14px; white-space: pre-line; max-width: 92%; }
.bubble.bot { background: var(--primary-soft); align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.pending { opacity: 0.7; font-style: italic; }
.chip:disabled { opacity: 0.5; }
.chips.links { margin-top: 8px; gap: 6px; }
.chips.links .chip { text-decoration: none; background: var(--card); font-style: normal; }
a.btn { display: inline-block; text-decoration: none; }
.bubble.me { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.ask { display: flex; gap: 8px; margin-top: 10px; }
.ask input { flex: 1; }

/* 交通路線 */
.route-opt { border-left: 4px solid var(--primary); }
.legs { list-style: none; margin: 10px 0 0; padding: 0; }
.leg { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); }
.leg:first-child { border-top: 0; }
.leg .mode { font-size: 1.4rem; text-align: center; }
.transfer { font-size: 0.8rem; color: var(--accent); padding-left: 42px; }
.stat { font-weight: 700; font-size: 1.05rem; }

/* 行程 */
.day h3 { color: var(--primary); }
.timeline { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--primary-soft); }
.timeline li { position: relative; padding: 6px 0 6px 10px; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.timeline li.travel::before { background: var(--accent); }
.timeline li.food::before { background: #f5a524; }

.notice { font-size: 0.8rem; color: var(--muted); background: var(--chip); padding: 8px 12px; border-radius: 10px; margin-top: 12px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
a { color: var(--primary); }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  background: none; border: 0; color: var(--muted);
  padding: 8px 0 10px; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tabbar button span { font-size: 1.25rem; }
.tabbar button.active { color: var(--primary); font-weight: 700; }

/* ---- visitor features ---- */
.topbar { align-items: center; }
.lang-btn {
  margin-left: auto; background: rgba(255, 255, 255, 0.16); color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem;
}
.zh { display: block; font-weight: 400; font-size: 0.85em; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--primary); text-decoration: underline; }
.phrases { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.phrase {
  display: flex; flex-direction: column; gap: 2px; text-align: left;
  background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.phrase:focus-visible, .btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.zh-big { font-size: 1.35rem; font-weight: 700; line-height: 1.3; }
.tea-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; }
.tea-grid .field { margin: 0; }
.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.tips li { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; }
.sos-num { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; grid-column: 1 / -1; font-size: 1.1rem; }
.tips li:has(.sos-num) { grid-template-columns: 1fr; gap: 0; }
label.btn { display: inline-block; cursor: pointer; }
.overlay {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: 24px 16px; text-align: center; cursor: pointer;
}
.overlay[hidden] { display: none; }
.zh-huge { font-size: clamp(2.2rem, 11vw, 5rem); font-weight: 800; line-height: 1.25; word-break: break-word; }
.overlay .py { font-size: 1.2rem; color: var(--muted); }
.overlay .en { font-size: 1.1rem; }
.close-hint { color: var(--muted); margin-top: 20px; }

</style>

// 交通路線規劃:在路網上以 Dijkstra 演算法找出最佳路線。

const TRANSFER_MINUTES = 15; // 每次轉乘預估的等車/步行時間

const STRATEGIES = {
  fastest: { label: '最快', cost: (e, transfer) => e.min + (transfer ? TRANSFER_MINUTES : 0) },
  cheapest: { label: '最省錢', cost: (e, transfer) => e.fare + e.min * 0.1 + (transfer ? 5 : 0) },
  fewest: { label: '最少轉乘', cost: (e, transfer) => e.min + (transfer ? 1000 : 0) },
};

function buildAdjacency(edges) {
  const adj = new Map();
  const add = (from, to, e) => {
    if (!adj.has(from)) adj.set(from, []);
    adj.get(from).push({ ...e, from, to });
  };
  for (const e of edges) {
    add(e.a, e.b, e);
    add(e.b, e.a, e);
  }
  return adj;
}

const ADJ = buildAdjacency(EDGES);

// 搜尋狀態包含「目前所在節點 + 搭乘中的路線」,才能正確計算轉乘成本。
function planRoute(fromId, toId, strategy = 'fastest') {
  if (fromId === toId) return null;
  const strat = STRATEGIES[strategy] ?? STRATEGIES.fastest;
  const key = (node, line) => `${node}|${line ?? ''}`;
  const dist = new Map([[key(fromId, null), 0]]);
  const prev = new Map();
  const queue = [{ node: fromId, line: null, cost: 0 }];

  while (queue.length) {
    queue.sort((x, y) => x.cost - y.cost);
    const cur = queue.shift();
    const curKey = key(cur.node, cur.line);
    if (cur.cost > (dist.get(curKey) ?? Infinity)) continue;
    if (cur.node === toId) return buildResult(curKey, prev, strategy);

    if (cur.node !== fromId && getDestination(cur.node)?.noTransit) continue;
    for (const e of ADJ.get(cur.node) ?? []) {
      const transfer = cur.line !== null && cur.line !== e.line;
      const nextCost = cur.cost + strat.cost(e, transfer);
      const nextKey = key(e.to, e.line);
      if (nextCost < (dist.get(nextKey) ?? Infinity)) {
        dist.set(nextKey, nextCost);
        prev.set(nextKey, { prevKey: curKey, edge: e });
        queue.push({ node: e.to, line: e.line, cost: nextCost });
      }
    }
  }
  return null;
}

function buildResult(endKey, prev, strategy) {
  const raw = [];
  for (let k = endKey; prev.has(k); k = prev.get(k).prevKey) raw.unshift(prev.get(k).edge);

  // 合併同一路線的連續路段
  const legs = [];
  for (const e of raw) {
    const last = legs[legs.length - 1];
    if (last && last.line === e.line) {
      last.to = e.to;
      last.min += e.min;
      last.fare += e.fare;
      last.stops.push(e.to);
      if (e.tip && !last.tips.includes(e.tip)) last.tips.push(e.tip);
    } else {
      legs.push({
        mode: e.mode, line: e.line, name: e.name, from: e.from, to: e.to,
        min: e.min, fare: e.fare, stops: [e.from, e.to], tips: e.tip ? [e.tip] : [],
      });
    }
  }
  const transfers = legs.length - 1;
  return {
    strategy,
    strategyLabel: STRATEGIES[strategy].label,
    legs,
    transfers,
    totalMin: legs.reduce((s, l) => s + l.min, 0) + transfers * TRANSFER_MINUTES,
    totalFare: legs.reduce((s, l) => s + l.fare, 0),
  };
}

// 一次計算三種策略,去除重複的路線
function planAlternatives(fromId, toId) {
  const seen = new Set();
  const results = [];
  for (const s of Object.keys(STRATEGIES)) {
    const r = planRoute(fromId, toId, s);
    if (!r) continue;
    const sig = r.legs.map((l) => `${l.line}:${l.from}>${l.to}`).join(',');
    if (seen.has(sig)) {
      results.find((x) => x.sig === sig).labels.push(r.strategyLabel);
      continue;
    }
    seen.add(sig);
    results.push({ ...r, sig, labels: [r.strategyLabel] });
  }
  return results;
}

// 多點串聯(依序經過每個地點)
function planMultiStop(ids, strategy = 'fastest') {
  const segments = [];
  for (let i = 0; i < ids.length - 1; i++) {
    if (ids[i] === ids[i + 1]) continue;
    const r = planRoute(ids[i], ids[i + 1], strategy);
    segments.push({ from: ids[i], to: ids[i + 1], route: r });
  }
  return segments;
}

function travelMinutes(fromId, toId) {
  if (fromId === toId) return 0;
  return planRoute(fromId, toId, 'fastest')?.totalMin ?? Infinity;
}

}

// 行程自動規劃:依照興趣、天數、步調,像導遊一樣排出每日行程。

const PACES = {
  relaxed: { label: '悠閒', hours: 5 },
  normal: { label: '一般', hours: 7 },
  packed: { label: '緊湊', hours: 9 },
};

// 第一次來台灣的經典必去(沒選偏好時優先推薦)
const CLASSICS = ['tp101', 'jiufen-st', 'sml-bike', 'anping', 'alishan-forest', 'npm', 'taroko-np', 'fengjia', 'pier2', 'shifen', 'qixingtan', 'kt-street'];

function scoreAttraction(att, interests) {
  const matches = att.tags.filter((t) => interests.includes(t)).length;
  return matches * 3 + (att.popular ? 1 : 0);
}

function isRelevant(att, interests) {
  return interests.length === 0 || att.tags.some((t) => interests.includes(t));
}

function destinationScore(dest, interests, usedIds) {
  return dest.attractions
    .filter((a) => !usedIds.has(a.id) && isRelevant(a, interests))
    .map((a) => scoreAttraction(a, interests))
    .sort((x, y) => y - x)
    .slice(0, 3)
    .reduce((s, x) => s + x, 0);
}

// 推薦景點排行(首頁「導遊推薦」使用)
function recommend(interests, { region, limit = 8 } = {}) {
  const list = [];
  for (const d of DESTINATIONS) {
    if (region && d.region !== region) continue;
    for (const a of d.attractions) {
      if (!isRelevant(a, interests)) continue;
      list.push({ ...a, destId: d.id, destName: d.name, score: scoreAttraction(a, interests) });
    }
  }
  const classic = (a) => (CLASSICS.includes(a.id) ? CLASSICS.indexOf(a.id) : CLASSICS.length);
  list.sort((x, y) => y.score - x.score || classic(x) - classic(y) || x.name.localeCompare(y.name, 'zh-Hant'));
  // 同一個地點最多推薦 2 個,讓結果分散到不同城市
  const perDest = {};
  const diverse = list.filter((a) => (perDest[a.destId] = (perDest[a.destId] ?? 0) + 1) <= 2);
  const rest = list.filter((a) => !diverse.includes(a));
  return [...diverse, ...rest].slice(0, limit);
}

function pickNextDestination(current, interests, usedAtt, visitedDest, region) {
  let best = null;
  for (const d of DESTINATIONS) {
    if (d.id === current || visitedDest.has(d.id)) continue;
    if (region && d.region !== region) continue;
    const score = destinationScore(d, interests, usedAtt);
    if (score <= 0) continue;
    const hrs = travelMinutes(current, d.id) / 60;
    if (!Number.isFinite(hrs)) continue;
    // 分數高、距離近的優先;車程超過 4 小時大幅扣分
    const value = score / (1 + hrs) - (hrs > 4 ? 5 : 0);
    if (!best || value > best.value) best = { id: d.id, value, hrs };
  }
  return best;
}

function pickMeal(dest, interests, usedFoods, hasNightSpot) {
  const foods = dest.foods.filter((f) => !usedFoods.has(`${dest.id}:${f.name}`) && !(hasNightSpot && f.type === '夜市'));
  if (!foods.length) return null;
  const preferMarket = interests.includes('美食') && !hasNightSpot;
  const f = (preferMarket && foods.find((x) => x.type === '夜市')) || foods.find((x) => x.type !== '伴手禮') || foods[0];
  usedFoods.add(`${dest.id}:${f.name}`);
  return f;
}

/**
 * @param {{start:string, days:number, interests:string[], pace?:keyof PACES, returnToStart?:boolean, stayInRegion?:boolean}} opts
 *   stayInRegion:只在出發地同一區域內移動(例如「花蓮三天」就只排東部)
 */
function generateItinerary({ start, days, interests = [], pace = 'normal', returnToStart = false, stayInRegion = false }) {
  const region = stayInRegion ? getDestination(start).region : null;
  const dayHours = PACES[pace]?.hours ?? PACES.normal.hours;
  const usedAtt = new Set();
  const usedFoods = new Set();
  const visitedDest = new Set([start]);
  let current = start;
  const plan = [];

  for (let day = 1; day <= days; day++) {
    let hoursLeft = dayHours;
    const items = [];
    const isLastDay = day === days;
    const returnMin = isLastDay && returnToStart ? travelMinutes(current, start) : 0;

    for (let guard = 0; guard < 20; guard++) {
      const dest = getDestination(current);
      const candidates = dest.attractions
        .filter((a) => !a.evening && !usedAtt.has(a.id) && isRelevant(a, interests))
        .sort((x, y) => scoreAttraction(y, interests) - scoreAttraction(x, interests));

      // 預留晚上逛夜市的時間
      const nightReserve = isLastDay && returnToStart ? 0 : Math.max(0, ...dest.attractions
        .filter((a) => a.evening && !usedAtt.has(a.id) && isRelevant(a, interests)).map((a) => a.hours));
      const budget = hoursLeft - nightReserve - (isLastDay && returnToStart ? returnMin / 60 : 0);
      const fit = candidates.find((a) => a.hours <= budget);
      if (fit) {
        usedAtt.add(fit.id);
        hoursLeft -= fit.hours;
        items.push({ type: 'spot', destId: current, destName: dest.name, ...fit });
        continue;
      }
      if (candidates.length > 0 || (isLastDay && returnToStart)) break; // 今天時間用完,明天繼續

      const next = pickNextDestination(current, interests, usedAtt, visitedDest, region);
      if (!next) break;
      if (next.hrs > budget && items.length > 0) break; // 車程太長,改到隔天早上出發
      const route = planRoute(current, next.id, 'fastest');
      items.push({ type: 'travel', from: current, to: next.id, route });
      hoursLeft -= route.totalMin / 60;
      visitedDest.add(next.id);
      current = next.id;
    }

    // 夜市等晚上才熱鬧的景點,安排在當天最後
    const here = getDestination(current);
    const night = here.attractions
      .filter((a) => a.evening && !usedAtt.has(a.id) && isRelevant(a, interests))
      .sort((x, y) => scoreAttraction(y, interests) - scoreAttraction(x, interests))[0];
    const leavingTonight = isLastDay && returnToStart && current !== start;
    if (night && !leavingTonight && night.hours <= hoursLeft) {
      usedAtt.add(night.id);
      items.push({ type: 'spot', destId: current, destName: here.name, ...night });
    }

    const meal = pickMeal(here, interests, usedFoods, Boolean(night) || leavingTonight);
    if (meal) items.push({ ...meal, type: 'food', foodType: meal.type, destId: current, destName: here.name });

    if (leavingTonight) {
      items.push({ type: 'travel', from: current, to: start, route: planRoute(current, start, 'fastest') });
      current = start;
    }
    plan.push({ day, items, stayAt: getDestination(current).name });
  }
  return plan;
}

};

function findDestinations(raw) {
  const text = String(raw).toLowerCase();
  const hits = [];
  for (const d of DESTINATIONS) {
    for (const n of [d.name, ...d.aliases, ...(EN_ALIASES[d.id] ?? [])]) {
      const key = n.toLowerCase();
      for (let p = text.indexOf(key); p >= 0; p = text.indexOf(key, p + 1)) {
        hits.push({ id: d.id, start: p, end: p + key.length });
      }
    }
  }
  // Longer names win ("桃園機場" / "taoyuan airport" is not also "桃園")
  const kept = hits.filter((h) => !hits.some((o) => o !== h && o.id !== h.id
    && o.start <= h.start && o.end >= h.end && o.end - o.start > h.end - h.start));
  // Order of appearance gives direction for "from A to B"
  return kept.sort((x, y) => x.start - y.start).map((h) => h.id).filter((id, i, arr) => arr.indexOf(id) === i);
}

function parseDays(text) {
  const m = String(text).toLowerCase().match(/([1-7一二兩三四五六七]|one|two|three|four|five|six|seven)\s*(?:[天日]|-?\s*days?\b)/);
  if (!m) return null;
  return NUM[m[1]] ?? Number(m[1]);
}

// English words match at a word start ("rain" must not match "train"); Chinese matches anywhere
const has = (text, words) => words.some((w) => (/^[a-z ]+$/.test(w)
  ? new RegExp(`\\b${w}`).test(text) : text.includes(w.toLowerCase())));
const L = (enText, zhText) => (getLang() === 'en' ? enText : zhText);
const place = (id) => withZh(dName(id), getDestination(id).name);

function searchText(word) {
  return DESTINATIONS.flatMap((d) => d.attractions
    .filter((a) => a.name.includes(word) || a.desc.includes(word) || (a.tip ?? '').includes(word))
    .map((a) => ({ ...a, destName: d.name, destId: d.id })));
}

const spotLine = (a) => `・${withZh(aName(a), a.name)} — ${dName(a.destId)}: ${aDesc(a)}${aTip(a) ? ` 💡${aTip(a)}` : ''}`;

function routeAnswer(from, to, assumedFrom) {
  const routes = planAlternatives(from, to);
  if (!routes.length) return { text: L(`I couldn't find public transport from ${dName(from)} to ${dName(to)}. A car or driver is best.`, `目前資料裡還找不到${dName(from)}到${dName(to)}的大眾運輸,建議租車或包車。`) };
  const labelEn = { 最快: 'Fastest', 最省錢: 'Cheapest', 最少轉乘: 'Fewest transfers' };
  const lines = routes.map((r) => {
    const steps = r.legs.map((l) => `${lineName(l.name)} (${dName(l.from)} → ${dName(l.to)}, ${L('about', '約')} ${duration(l.min)})`).join(' → ');
    const labels = r.labels.map((x) => L(labelEn[x] ?? x, x)).join('/');
    return `【${labels}】${L('about', '約')} ${duration(r.totalMin)}, NT$${r.totalFare}\n  ${steps}`;
  });
  const head = assumedFrom ? L(`Assuming you start in Taipei (tell me e.g. "from Kaohsiung to ${dName(to)}" to change it):\n`, `我先假設你從台北出發(可以跟我說「從高雄到${dName(to)}」換出發地):\n`) : '';
  return {
    text: `${head}${L(`${dName(from)} to ${place(to)}:`, `${dName(from)}到${dName(to)}有這些走法:`)}\n${lines.join('\n')}\n\n🚏 ${L('When you arrive', '到了之後')}: ${dLocal(getDestination(to))}\n${L('(Times and fares are estimates)', '(時間票價為參考值)')}`,
    action: { type: 'route', from, to },
  };
}

function planAnswer(start, days, interests, stayInRegion) {
  const plan = generateItinerary({ start, days, interests, returnToStart: false, stayInRegion });
  const lines = plan.map((d) => {
    const stayId = DESTINATIONS.find((x) => x.name === d.stayAt)?.id;
    const stay = stayId ? dName(stayId) : d.stayAt;
    if (!d.items.length) return L(`Day ${d.day}: free time; explore more slowly or find a café (stay in ${stay})`, `Day ${d.day}:自由活動,可以再深度探索或安排 SPA、咖啡廳(住${stay})`);
    const parts = d.items.map((i) => (i.type === 'travel' ? `🚆${L('to', '前往')} ${dName(i.to)}`
      : i.type === 'food' ? `🍽️${withZh(fName(i.destId, i), i.name)}` : withZh(aName(i), i.name)));
    return `Day ${d.day}: ${parts.join(' → ')} (${L('stay in', '住')} ${stay})`;
  });
  return {
    text: `${L(`Here's a ${days}-day plan from ${dName(start)}:`, `幫你排了 ${days} 天的${dName(start)}出發行程:`)}\n${lines.join('\n')}\n\n${L('Fine-tune the pace and interests in the Plan tab.', '想調整步調或偏好,可以到「行程」分頁細修。')}`,
    action: { type: 'plan', start, days, interests },
  };
}

function askGuide(question, lang = getLang()) {
  const prev = getLang();
  setLang(lang);
  try {
    return answer(question.trim());
  } finally {
    setLang(prev);
  }
}

function answer(text) {
  if (!text) return greet();
  const lower = text.toLowerCase();
  const dests = findDestinations(text);
  const region = REGIONS.find((r) => text.includes(r)) ?? Object.entries(REGION_WORDS).find(([w]) => new RegExp(`\\b${w}\\b`).test(lower))?.[1];
  const interests = Object.entries(INTEREST_WORDS).filter(([, ws]) => has(lower, ws)).map(([k]) => k);
  const days = parseDays(text);
  const wantsRoute = has(lower, INTENT_WORDS.route) || (dests.length >= 2 && (/從|到|去/.test(text) || /\b(from|to)\b/.test(lower)));

  // Transport: "Taipei to Tainan how long", "how do I get to Sun Moon Lake", 「台北去台南要多久」
  if (wantsRoute && !days) {
    if (dests.length >= 2) return routeAnswer(dests[0], dests[1]);
    if (dests.length === 1 && dests[0] !== 'taipei') return routeAnswer('taipei', dests[0], true);
  }

  // Itinerary: "3 days in Hualien", 「花蓮三天怎麼玩」
  if (days || has(lower, INTENT_WORDS.plan)) {
    return planAnswer(dests[0] ?? 'taipei', Math.min(days ?? 2, 7), interests, Boolean(dests[0]));
  }

  const dest = dests[0] ? getDestination(dests[0]) : null;

  // Keywords: sunset, sunrise, lanterns…
  const free = [...FREE_WORDS, ...Object.keys(WORD_SYNONYMS)].find((w) => has(lower, [w]));
  if (free && free !== '海鮮' && free !== '夜市') {
    const word = WORD_SYNONYMS[free] ?? free;
    let spots = searchText(word);
    if (dest) spots = spots.filter((a) => a.destId === dest.id).concat(spots.filter((a) => a.destId !== dest.id));
    if (spots.length) {
      return { text: `${L(`Best places for ${WORD_EN[word] ?? word}:`, `想看${word},推薦這些地方:`)}\n${spots.slice(0, 5).map(spotLine).join('\n')}` };
    }
  }

  // Food
  if (has(lower, INTENT_WORDS.food)) {
    const fw = Object.keys(FOOD_WORDS).find((w) => has(lower, [w]));
    const foodWord = fw ? FOOD_WORDS[fw] : null;
    const match = (f) => !foodWord || f.name.includes(foodWord) || f.type.includes(foodWord) || f.desc.includes(foodWord);
    const foodLine = (destId, f) => `・【${fType(f.type)}】${withZh(fName(destId, f), f.name)}: ${fDesc(destId, f)}`;
    const shopLine = (x) => `・${withZh(sName(x), x.name)} (${sArea(x)}): ${sNote(x)}`;
    if (dest) {
      const list = dest.foods.filter(match);
      const shown = list.length ? list : dest.foods;
      if (!shown.length) return { text: L(`${dName(dest.id)} is mostly about nature; eat in the nearest town.`, `${dest.name}以自然景觀為主,比較少特色小吃,建議回到鄰近市區用餐。`) };
      const note = foodWord && !list.length
        ? L(`${dName(dest.id)} isn't known for ${fType(foodWord).toLowerCase()}, but these are worth trying:\n`, `${dest.name}沒有特別以「${foodWord}」出名,不過這些很值得吃:\n`)
        : L(`What to eat in ${dName(dest.id)}:\n`, `來${dest.name}推薦你吃:\n`);
      const shops = shopsOf(dest.id).filter((x) => !foodWord || x.dish === foodWord || shown.some((f) => f.name === x.dish));
      const shopText = shops.length ? `\n\n📍 ${L('Local favourites', '在地知名店家')}:\n${shops.slice(0, 5).map(shopLine).join('\n')}` : '';
      const cash = L('\n\n💵 Bring cash: small shops and night-market stalls often don’t take cards.', '');
      return { text: note + shown.slice(0, 6).map((f) => foodLine(dest.id, f)).join('\n') + shopText + cash, action: { type: 'food', destId: dest.id } };
    }
    const all = [
      ...(foodWord === '早餐' ? DESTINATIONS.flatMap((d) => shopsOf(d.id, '早餐').map((x) => `${shopLine(x)} — ${dName(d.id)}`)) : []),
      ...DESTINATIONS.flatMap((d) => d.foods.filter(match).map((f) => `${foodLine(d.id, f)} — ${dName(d.id)}`)),
    ];
    if (foodWord && all.length) return { text: `${L(`${fType(foodWord)} picks around Taiwan:`, `各地的${foodWord}推薦:`)}\n${all.slice(0, 8).join('\n')}` };
    const markets = DESTINATIONS.flatMap((d) => d.foods.filter((f) => f.type === '夜市').map((f) => `${withZh(fName(d.id, f), f.name)} — ${dName(d.id)}`));
    return { text: L(`Must-visit night markets: ${markets.join(', ')}.\nTell me which city you're in (e.g. "What to eat in Tainan?") for local picks!`, `台灣必逛的夜市有:${markets.join('、')}。\n告訴我你在哪個城市(例如「台南有什麼好吃的」),我可以推薦當地小吃!`) };
  }

  // About one place
  if (dest) {
    if (!dest.attractions.length) return { ...routeAnswer(dest.id === 'taipei' ? 'airport' : 'taipei', dest.id), text: `${dIntro(dest)}\n${dLocal(dest)}` };
    const picks = recommend(interests, { limit: 50 }).filter((a) => a.destId === dest.id).slice(0, 4);
    const list = (picks.length ? picks : dest.attractions.map((a) => ({ ...a, destId: dest.id })).slice(0, 4))
      .map((a) => `・${withZh(aName(a), a.name)} (${L('about', '建議')} ${a.hours} ${L('h', '小時')}): ${aDesc(a)}`);
    const food = dest.foods.slice(0, 3).map((f) => withZh(fName(dest.id, f), f.name)).join(L(', ', '、'));
    return {
      text: `${dIntro(dest)}\n${L('Go see:', '推薦你去:')}\n${list.join('\n')}${food ? `\n\n😋 ${L('Must eat', '必吃')}: ${food}` : ''}\n🚏 ${L('Getting around', '在地交通')}: ${dLocal(dest)}`,
      action: { type: 'dest', destId: dest.id },
    };
  }

  if (interests.length || region || has(lower, INTENT_WORDS.play) || text.includes('第一次')) {
    const picks = recommend(interests, { region, limit: 6 });
    if (!picks.length) return { text: L('I couldn’t find a good match. Try asking another way?', '這個條件我暫時找不到適合的景點,換個說法試試看?') };
    const label = interests.map((k) => interestName(k, INTERESTS.find((i) => i.key === k)?.label)).join(L(', ', '、'));
    const where = region ? regionName(region) : L('Taiwan', '全台');
    const head = L(`${label ? `${label} picks` : 'Must-sees'} in ${where}`, `${where}${label ? `「${label}」` : '必去'}推薦`);
    return { text: `${head}:\n${picks.map(spotLine).join('\n')}` };
  }

  return { ...greet(), text: `${L('I’m not sure what you mean 🙏', '我不太確定你想問什麼 🙏')}\n${greet().text}` };
}

function greet() {
  return {
    text: L(
      'Hi! I’m your local buddy in Taiwan 🧭\nAsk me things like:\n・What should I eat in Tainan?\n・How long from Taipei to Hualien?\n・3 days in Hualien?\n・Best place for the sunset?\n・Rainy day in Taichung, where to go?',
      '你好!我是你的台灣小導遊 🧭\n你可以問我:\n・台南有什麼好吃的?\n・台北去花蓮要多久?\n・花蓮三天怎麼玩?\n・哪裡看夕陽最美?\n・下雨天台中可以去哪?',
    ),
  };
}

// AI guide: on claude.ai, Claude understands the question and answers using the tools below,
// which read the app's own data (places, food, shops, routes, itineraries).
// When Claude isn't available (opened as a file, not granted, …) this returns null and guide.js takes over.

const MAX_TURNS = 10;

function resolvePlace(name) {
  const id = findDestinations(String(name ?? ''))[0];
  if (!id) throw new Error(`No place "${name}" in the app. Known places: ${DESTINATIONS.map((d) => `${DEST_EN[d.id].name} (${d.name})`).join(', ')}`);
  return id;
}

const enPlace = (id) => `${DEST_EN[id]?.name ?? id} (${placeName(id)})`;
const enAttr = (a) => ({ name: a.name, en: ATTR_EN[a.id]?.name, hours: a.hours, tags: a.tags, desc: ATTR_EN[a.id]?.desc ?? a.desc, tip: ATTR_EN[a.id]?.tip ?? a.tip });

const TOOLS = [
  {
    name: 'get_destination',
    description: 'Look up one place (city or scenic area): intro, local transport, all attractions, typical foods, and specific well-known local shops. Chinese name in `name`, English in `en`. Returns JSON.',
    inputSchema: { type: 'object', properties: { name: { type: 'string', description: 'Place name in English or Chinese, e.g. Tainan / 台南, Jiufen, Sun Moon Lake' } }, required: ['name'] },
    execute({ name }) {
      const d = getDestination(resolvePlace(name));
      const e = DEST_EN[d.id];
      return {
        name: d.name, en: e.name, region: d.region, intro: e.intro, localTransport: e.localTransport,
        attractions: d.attractions.map((a) => ({ ...enAttr(a), nightOnly: a.evening })),
        foods: d.foods.map((f) => ({ name: f.name, en: FOOD_EN[`${d.id}:${f.name}`]?.name, type: f.type, desc: FOOD_EN[`${d.id}:${f.name}`]?.desc ?? f.desc })),
        shops: shopsOf(d.id).map((x) => ({ name: x.name, en: SHOP_EN[x.name]?.name, dish: x.dish, area: SHOP_EN[x.name]?.area ?? x.area, note: SHOP_EN[x.name]?.note ?? x.note })),
      };
    },
  },
  {
    name: 'search_attractions',
    description: 'Search attractions across Taiwan by interest tag (Chinese keys), region (Chinese), or a keyword found in the Chinese name/description (e.g. 夕陽 sunset, 日出 sunrise, 天燈 lantern). Returns the top 8.',
    inputSchema: {
      type: 'object',
      properties: {
        interests: { type: 'array', items: { type: 'string', enum: INTERESTS.map((i) => i.key) } },
        region: { type: 'string', enum: REGIONS },
        keyword: { type: 'string', description: 'Chinese keyword searched in names and descriptions' },
      },
    },
    execute({ interests, region, keyword }) {
      const tags = Array.isArray(interests) ? interests.map(String) : [];
      let list = recommend(tags, { region: region ? String(region) : undefined, limit: 200 });
      if (keyword) list = list.filter((a) => `${a.name}${a.desc}${a.tip ?? ''}`.includes(String(keyword)));
      return list.slice(0, 8).map((a) => ({ ...enAttr(a), place: enPlace(a.destId) }));
    },
  },
  {
    name: 'plan_route',
    description: 'Public transport between two places: fastest / cheapest / fewest-transfer options with each leg, minutes and estimated fare in NTD.',
    inputSchema: { type: 'object', properties: { from: { type: 'string' }, to: { type: 'string' } }, required: ['from', 'to'] },
    execute({ from, to }) {
      const a = resolvePlace(from);
      const b = resolvePlace(to);
      if (a === b) throw new Error('Start and destination are the same');
      const routes = planAlternatives(a, b);
      return {
        from: enPlace(a), to: enPlace(b), arrivalTip: DEST_EN[b].localTransport,
        options: routes.map((r) => ({
          type: r.labels, totalMinutes: r.totalMin, totalFareNTD: r.totalFare, transfers: r.transfers,
          legs: r.legs.map((l) => ({ by: `${LINE_EN[l.name] ?? l.name} (${l.name})`, from: enPlace(l.from), to: enPlace(l.to), minutes: l.min, fareNTD: l.fare, tips: l.tips })),
        })),
      };
    },
  },
  {
    name: 'make_itinerary',
    description: 'Build a multi-day itinerary: each day’s spots, travel and a food pick. stay_in_region=true keeps it within the start’s region.',
    inputSchema: {
      type: 'object',
      properties: {
        start: { type: 'string' },
        days: { type: 'integer', minimum: 1, maximum: 7 },
        interests: { type: 'array', items: { type: 'string', enum: INTERESTS.map((i) => i.key) } },
        pace: { type: 'string', enum: Object.keys(PACES) },
        stay_in_region: { type: 'boolean' },
      },
      required: ['start', 'days'],
    },
    execute({ start, days, interests, pace, stay_in_region: stayInRegion }) {
      const plan = generateItinerary({
        start: resolvePlace(start),
        days: Math.min(7, Math.max(1, Number(days) || 2)),
        interests: Array.isArray(interests) ? interests.map(String) : [],
        pace: PACES[pace] ? pace : 'normal',
        stayInRegion: Boolean(stayInRegion),
      });
      return plan.map((d) => ({
        day: d.day,
        stayAt: d.stayAt,
        items: d.items.map((i) => (i.type === 'travel'
          ? `Travel ${enPlace(i.from)} → ${enPlace(i.to)} by ${i.route.legs.map((l) => LINE_EN[l.name] ?? l.name).join(' → ')}, about ${i.route.totalMin} min`
          : i.type === 'food' ? `Food: ${FOOD_EN[`${i.destId}:${i.name}`]?.name ?? ''} (${i.name})` : `${ATTR_EN[i.id]?.name ?? ''} (${i.name}), ${i.hours} h`)),
      }));
    },
  },
];

let samplePromise = null;
let disabled = false;

// Resolves the sample function when Claude with tools is available, else null
async function getSampler() {
  if (disabled || typeof window === 'undefined' || !window.claude?.use) return null;
  samplePromise ??= window.claude.use('sample').then(async (sample) => {
    if (!sample) return null;
    const limits = await sample.limits().catch(() => null);
    return limits?.tools ? sample : null;
  }).catch(() => null);
  return samplePromise;
}

let rawPromise = null;
// sample() without the tools requirement, plus its limits (for photos and phrase cards)
async function getRawSampler() {
  if (typeof window === 'undefined' || !window.claude?.use) return null;
  rawPromise ??= window.claude.use('sample').then(async (sample) => {
    if (!sample) return null;
    const limits = await sample.limits().catch(() => null);
    return { sample, images: Boolean(limits?.images), mediaTypes: limits?.images?.mediaTypes ?? [] };
  }).catch(() => null);
  return rawPromise;
}

const PHOTO_PROMPT = (lang) => `This photo was taken by a foreign visitor in Taiwan: a menu, sign, label or ticket.
Translate it for them into ${lang === 'zh' ? 'Traditional Chinese (Taiwan)' : 'English'}.
For a menu: one line per item as "・中文名 — translation — price", then short notes on anything a visitor should know: pork, beef, seafood, spicy, peanuts or other common allergens, vegetarian options, and 1–2 items worth trying.
For a sign or notice: what it says and what the visitor should do.
Plain text only, no Markdown. If the photo is unreadable, say so and suggest retaking it closer.`;

async function translatePhoto(file, lang, { onText, signal } = {}) {
  const raw = await getRawSampler();
  if (!raw?.images) return { error: 'images_unavailable' };
  try {
    const { text } = await raw.sample(PHOTO_PROMPT(lang), { images: file, modelTier: 'default', cache: false, onText: ({ text: t }) => onText?.(t), signal });
    return { text };
  } catch (e) {
    return { error: e?.code ?? 'upstream_error', text: e?.text };
  }
}

async function makePhrase(text) {
  const raw = await getRawSampler();
  if (!raw) return { error: 'not_available' };
  try {
    const card = await raw.sample.json(`A foreign visitor in Taiwan wants to show this to a local (shop owner, driver, staff): "${text}"
Write it as natural, polite Taiwanese Mandarin in Traditional Chinese characters, short enough for a big card.
Reply with only JSON: {"zh": "...", "py": "hanyu pinyin with tone marks", "en": "short English back-translation"}`, { modelTier: 'quick' });
    if (!card?.zh) return { error: 'invalid_json' };
    return { card: { zh: String(card.zh), py: String(card.py ?? ''), en: String(card.en ?? text) } };
  } catch (e) {
    return { error: e?.code ?? 'upstream_error' };
  }
}

const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'tools_unavailable'];

/**
 * @param {{who:'me'|'bot', text:string}[]} history the chat so far (last item is the traveller's new question)
 * @returns {Promise<{text:string}|{error:string, permanent:boolean, text?:string}|null>}
 */
async function askClaude(history, { onText, signal } = {}) {
  const sample = await getSampler();
  if (!sample) return null;
  const turns = history.slice(-MAX_TURNS).filter((m) => m.text?.trim())
    .map((m) => ({ role: m.who === 'me' ? 'user' : 'assistant', content: m.text }));
  while (turns.length && turns[0].role !== 'user') turns.shift();
  try {
    const { text } = await sample([{ role: 'user', content: RULES }, ...turns], {
      tools: TOOLS, modelTier: 'quick', signal, onText: ({ text: t }) => onText?.(t),
    });
    return { text };
  } catch (e) {
    const code = e?.code ?? 'upstream_error';
    if (PERMANENT.includes(code)) disabled = true;
    return { error: code, permanent: PERMANENT.includes(code), text: e?.text };
  }
}


function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(lat2 - lat1);
  const dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function nearbyAttractions(lat, lng, limit = 6) {
  return DESTINATIONS.flatMap((d) => d.attractions.map((a) => ({ ...a, destId: d.id, destName: d.name })))
    .map((a) => ({ ...a, km: distanceKm(lat, lng, a.lat, a.lng) }))
    .sort((x, y) => x.km - y.km)
    .slice(0, limit);
}

function nearestDestination(lat, lng) {
  return DESTINATIONS.map((d) => ({ d, km: distanceKm(lat, lng, d.lat, d.lng) })).sort((x, y) => x.km - y.km)[0].d;
}

function mapsUrl(name) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
}

function transitUrl(fromName, toName) {
  const p = new URLSearchParams({ api: '1', origin: fromName, destination: toName, travelmode: 'transit' });
  return `https://www.google.com/maps/dir/?${p}`;
}

const PLACE_INDEX = [
  ...Object.entries(SHOPS).flatMap(([destId, list]) => list.map((x) => ({ zh: x.name, label: () => sName(x), query: `${x.name} ${getDestination(destId).name}` }))),
  ...DESTINATIONS.flatMap((d) => d.attractions.map((a) => {
    const zh = a.name.replace(/(.*?)/g, '');
    return { zh, label: () => aName(a).replace(/ \(.*?\)$/, ''), query: zh };
  })),
].sort((x, y) => y.zh.length - x.zh.length);

function placeLinks(text) {
  const found = [];
  let rest = text;
  for (const p of PLACE_INDEX) {
    const short = p.zh.split('・')[0];
    const key = rest.includes(p.zh) ? p.zh : short.length >= 3 && rest.includes(short) ? short : null;
    if (!key) continue;
    found.push(p);
    rest = rest.split(key).join('');
    if (found.length >= 8) break;
  }
  return found;
}

  if (state.aiMode === 'offline') return `<span class="tag">${t('offline')}</span>`;
  return '';
}

// ---------- pages ----------
function renderHome() {
  const recs = recommend(state.interests, { region: state.region || undefined, limit: 6 });
  const nearby = state.nearby?.error ? `<div class="empty">${t(state.nearby.error)}</div>` : (state.nearby?.items ?? []).map(spotCard).join('');
  return `
    <div class="card">
      <div class="row spread"><h2 style="margin:0">${t('askTitle')}</h2>${aiBadge()}</div>
      <div class="chat" id="chat">${state.chat.map((m, i) => `<div class="bubble ${m.who}${m.pending ? ' pending' : ''}" id="bubble-${i}">${esc(m.text)}${linkChips(m.links)}</div>`).join('')}</div>
      <form class="ask" data-form="ask">
        <input type="text" name="q" id="ask-q" placeholder="${esc(t('askPlaceholder'))}" autocomplete="off" ${state.chatBusy ? 'disabled' : ''} />
        <button class="btn" type="submit" ${state.chatBusy ? 'disabled' : ''}>${state.chatBusy ? t('answering') : t('send')}</button>
      </form>
      <div class="chips" style="margin-top:8px">${t('examples').map((q) => `<button class="chip small" data-action="ask" data-q="${esc(q)}" ${state.chatBusy ? 'disabled' : ''}>${esc(q)}</button>`).join('')}</div>
    </div>

    <h2>${t('recTitle')}</h2>
    <p class="muted">${t('recHint')}</p>
    ${interestChips(state.interests, 'home')}
    <label class="field" for="region">${t('region')}</label>
    <select id="region" data-bind="region">
      <option value="">${t('allTaiwan')}</option>
      ${REGIONS.map((r) => `<option value="${r}" ${r === state.region ? 'selected' : ''}>${regionName(r)}</option>`).join('')}
    </select>
    <div class="grid" style="margin-top:12px">${recs.map(spotCard).join('') || `<div class="empty">${t('noMatch')}</div>`}</div>

    <h2>${t('nearTitle')}</h2>
    <button class="btn ghost" data-action="nearby">${t('useLocation')}</button>
    <div class="grid" style="margin-top:12px">${nearby}</div>`;
}

function renderPlan() {
  const p = state.plan;
  const stayName = (zh) => {
    const id = DESTINATIONS.find((x) => x.name === zh)?.id;
    return id ? withZh(dName(id), zh) : zh;
  };
  const result = p.result ? p.result.map((d) => `
    <div class="card day">
      <h3>Day ${d.day}</h3>
      <ul class="timeline">${d.items.map(renderItem).join('') || `<li>${t('free')}</li>`}</ul>
      <div class="muted small" style="margin-top:6px">${t('tonight')} ${esc(stayName(d.stayAt))}</div>
    </div>`).join('') : '';
  return `
    <h2>${t('planTitle')}</h2>
    <div class="card">
      <label class="field" for="plan-start">${t('start')}</label>
      <select id="plan-start" data-bind="plan.start">${destOptions(p.start)}</select>
      <div class="row" style="gap:12px">
        <div style="flex:1"><label class="field" for="plan-days">${t('days')}</label>
          <select id="plan-days" data-bind="plan.days">${[1, 2, 3, 4, 5, 6, 7].map((n) => `<option value="${n}" ${n === p.days ? 'selected' : ''}>${n} ${n === 1 ? t('day') : t('daysN')}</option>`).join('')}</select></div>
        <div style="flex:1"><label class="field" for="plan-pace">${t('pace')}</label>
          <select id="plan-pace" data-bind="plan.pace">${Object.entries(PACES).map(([k, v]) => `<option value="${k}" ${k === p.pace ? 'selected' : ''}>${isEn() ? PACE_EN[k] : v.label} ${t('paceHint', { h: v.hours })}</option>`).join('')}</select></div>
      </div>
      <label class="field">${t('prefs')}</label>
      ${interestChips(p.interests, 'plan')}
      <label class="row small" style="margin-top:10px"><input type="checkbox" id="plan-return" data-bind="plan.returnToStart" ${p.returnToStart ? 'checked' : ''}/> ${t('returnStart')}</label>
      <div style="margin-top:12px"><button class="btn" data-action="make-plan">${t('makePlan')}</button></div>
    </div>
    ${result}
    ${p.result ? `<p class="notice">${t('planNote')}</p>` : ''}
    ${renderSaved()}`;
}

function renderItem(it) {
  if (it.type === 'travel') {
    const r = it.route;
    const how = r.legs.map((l) => `${MODE_INFO[l.mode].icon} ${lineName(l.name)}`).join(' → ');
    return `<li class="travel"><strong>${t('move')} ${esc(dName(it.from))} → ${esc(dName(it.to))}</strong>
      <div class="small muted">${esc(how)} ・ ${t('about')} ${duration(r.totalMin)} ・ NT$${r.totalFare}</div></li>`;
  }
  if (it.type === 'food') {
    return `<li class="food"><strong>${t('foodPick')} ${dual(fName(it.destId, it), it.name)}</strong><div class="small muted">${esc(fDesc(it.destId, it))}</div></li>`;
  }
  return `<li><strong>${dual(aName(it), it.name)}</strong> <span class="muted small">(${it.hours} ${t('hours')})</span>
    <div class="small muted">${esc(aDesc(it))}</div>
    <a class="small" href="${mapsUrl(it.name)}" target="_blank" rel="noopener">${t('map')}</a></li>`;
}

function renderRoute() {
  const r = state.route;
  const results = r.results == null ? '' : r.results.length
    ? r.results.map((x) => routeCard(x, r.from, r.to)).join('')
    : `<div class="empty">${t('noRoute')}</div>`;
  const d = getDestination(r.to);
  return `
    <h2>${t('transitTitle')}</h2>
    <div class="card">
      <label class="field" for="route-from">${t('from')}</label>
      <select id="route-from" data-bind="route.from">${destOptions(r.from)}</select>
      <div style="text-align:center; margin-top:6px"><button class="btn ghost small" data-action="swap">${t('swap')}</button></div>
      <label class="field" for="route-to">${t('to')}</label>
      <select id="route-to" data-bind="route.to">${destOptions(r.to)}</select>
      <div style="margin-top:12px"><button class="btn" data-action="find-route">${t('search')}</button></div>
    </div>
    ${results}
    <p class="notice">${t('fareNote')}</p>
    <div class="card"><h3>${t('arrived', { p: esc(dName(d.id)) })}</h3><p class="small">${esc(dLocal(d))}</p></div>`;
}

function renderExplore() {
  const d = getDestination(state.explore.destId);
  const byType = {};
  for (const f of d.foods) (byType[f.type] ??= []).push(f);
  const foods = Object.entries(byType).map(([type, list]) => `
    <div class="card"><h3>${esc(fType(type))}</h3>${list.map((f) => `<p><strong>${dual(fName(d.id, f), f.name)}</strong><br><span class="small muted">${esc(fDesc(d.id, f))}</span>
      <br><a class="small" href="${mapsUrl(`${d.name} ${f.name}`)}" target="_blank" rel="noopener">${t('findShops')}</a></p>`).join('')}</div>`).join('');
  const shops = shopsOf(d.id);
  return `
    <h2>${t('eatTitle')}</h2>
    <select id="explore-dest" data-bind="explore.destId" aria-label="${t('region')}">${destOptions(d.id)}</select>
    <div class="card" style="margin-top:12px">
      <h3>${dual(dName(d.id), d.name)}</h3><p>${esc(dIntro(d))}</p><p class="small muted">🚏 ${esc(dLocal(d))}</p>
    </div>
    <h2>${t('eats')}</h2>
    ${foods || `<div class="empty">${t('noFood')}</div>`}
    ${shops.length ? `<h2>${t('shopsTitle')}</h2>
    <p class="muted small">${t('shopsHint')}</p>
    <div class="grid">${shops.map((x) => `<div class="card">
      <h3>${dual(sName(x), x.name)}</h3>
      <div class="muted small">${esc(dishLabel(d.id, x.dish))} ・ ${esc(sArea(x))}</div>
      <p class="small">${esc(sNote(x))}</p>
      <div class="row">
        <a class="btn ghost small" href="${mapsUrl(`${x.name} ${d.name}`)}" target="_blank" rel="noopener">${t('googleRating')}</a>
        ${isEn() ? `<button class="link small" data-action="show-card" data-zh="${esc(x.name)}" data-en="${esc(sName(x))}">${t('showLocal')}</button>` : ''}
      </div>
    </div>`).join('')}</div>` : ''}
    <h2>${t('fun')}</h2>
    <div class="grid">${d.attractions.map((a) => spotCard({ ...a, destId: d.id })).join('') || `<div class="empty">${t('hub')}</div>`}</div>`;
}

// a shop's "dish" is either a food type (早餐) or one of the place's foods (牛肉麵)
const dishLabel = (destId, dish) => (fType(dish) !== dish ? fType(dish) : fName(destId, { name: dish }));

function renderSaved() {
  if (!state.saved.length) return `<h2>${t('savedTitle')}</h2><div class="empty">${t('savedEmpty')}</div>`;
  const items = state.saved.map((s) => findAttraction(s.id)).filter(Boolean);
  const stops = [...new Set(items.map((a) => a.destId))];
  const segs = planMultiStop(stops);
  const routeHtml = segs.length ? `<div class="card"><h3>${t('chain')}</h3><ul class="legs">${segs.map((s) => s.route
    ? `<li class="leg"><div class="mode">${MODE_INFO[s.route.legs[0].mode].icon}</div><div><strong>${esc(dName(s.from))} → ${esc(dName(s.to))}</strong>
       <div class="small muted">${s.route.legs.map((l) => esc(lineName(l.name))).join(' → ')} ・ ${t('about')} ${duration(s.route.totalMin)} ・ NT$${s.route.totalFare}</div></div></li>`
    : `<li class="leg"><div class="mode">🚕</div><div>${esc(dName(s.from))} → ${esc(dName(s.to))}: ${t('needCar')}</div></li>`).join('')}</ul></div>` : '';
  return `<h2>${t('savedTitle')}</h2>
    ${items.map((a, i) => `<div class="card row spread">
      <div><strong>${dual(aName(a), a.name)}</strong><div class="muted small">${esc(dName(a.destId))} ・ ${a.hours} ${t('hours')}</div></div>
      <div class="row">
        <button class="btn ghost small" data-action="move" data-id="${a.id}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Up">↑</button>
        <button class="btn ghost small" data-action="move" data-id="${a.id}" data-dir="1" ${i === items.length - 1 ? 'disabled' : ''} aria-label="Down">↓</button>
        <button class="btn ghost small" data-action="save" data-id="${a.id}">${t('remove')}</button>
      </div></div>`).join('')}
    ${routeHtml}`;
}

  return `<button class="phrase" data-action="show-phrase" data-i="${i}">
    <span class="zh-big">${esc(p.zh)}</span>
    <span class="small muted">${esc(p.py)}</span>
    <span class="small">${esc(p.en)}</span>
  </button>`;
}

function teaOrder() {
  const x = state.help.tea;
  const pick = (list, i) => list[i];
  const d = pick(TEA.drinks, x.drink); const s = pick(TEA.sugar, x.sugar); const ice = pick(TEA.ice, x.ice); const size = pick(TEA.size, x.size);
  return { zh: `${size.zh}${d.zh},${s.zh}${ice.zh}`, py: '', en: `${size.en} ${d.en}, ${s.en.toLowerCase()}, ${ice.en.toLowerCase()}` };
}

function teaSelect(key, list) {
  return `<select id="tea-${key}" data-bind="help.tea.${key}">${list.map((o, i) => `<option value="${i}" ${state.help.tea[key] === i ? 'selected' : ''}>${esc(isEn() ? `${o.en} · ${o.zh}` : o.zh)}</option>`).join('')}</select>`;
}

        <input type="text" name="p" id="phrase-q" placeholder="${esc(t('customPlaceholder'))}" autocomplete="off" ${custom.busy ? 'disabled' : ''} />

const PAGES = { home: renderHome, plan: renderPlan, route: renderRoute, explore: renderExplore, help: renderHelp };

function render() {
  document.documentElement.lang = isEn() ? 'en' : 'zh-Hant-TW';
  document.getElementById('lang-btn').textContent = t('langToggle');
  nav.innerHTML = TABS.map(([id, icon, key]) => `<button data-tab="${id}" class="${state.tab === id ? 'active' : ''}"><span>${icon}</span>${t(key)}</button>`).join('');
  view.innerHTML = PAGES[state.tab]();
  const chat = document.getElementById('chat');
  if (chat) chat.scrollTop = chat.scrollHeight;
}

function go(tab) {
  state.tab = tab;
  render();
  window.scrollTo(0, 0);
}

function showCard(card) {
  overlay.innerHTML = `<div class="zh-huge">${esc(card.zh)}</div>
    ${card.py ? `<div class="py">${esc(card.py)}</div>` : ''}
    ${card.en ? `<div class="en">${esc(card.en)}</div>` : ''}
    <div class="small close-hint">${t('tapClose')}</div>`;
  overlay.hidden = false;
}

// ---------- events ----------
overlay.addEventListener('click', () => { overlay.hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') overlay.hidden = true; });

document.getElementById('lang-btn').addEventListener('click', () => {
  setLang(isEn() ? 'zh' : 'en');
  storage.set('lang', getLang());
  // refresh the greeting if the chat hasn't started yet
  if (state.chat.length === 1 && state.chat[0].greeting) state.chat[0].text = askGuide('').text;
  render();
});

nav.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (b) go(b.dataset.tab);
});

view.addEventListener('change', async (e) => {
  if (e.target.id === 'photo-input') {
    const file = e.target.files?.[0];
    if (file) runPhoto(file);
    return;
  }
  const path = e.target.dataset.bind;
  if (!path) return;
  const keys = path.split('.');
  let value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (path === 'plan.days' || path.startsWith('help.tea.')) value = Number(value);
  let obj = state;
  for (const k of keys.slice(0, -1)) obj = obj[k];
  obj[keys.at(-1)] = value;
  if (path === 'route.to' || path === 'route.from') state.route.results = null;
  render();
});

view.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.dataset.form === 'ask') sendQuestion(e.target.q.value);
  if (e.target.dataset.form === 'phrase') runPhrase(e.target.p.value);
});

function applyAction(action) {
  if (action?.type === 'route') Object.assign(state.route, { from: action.from, to: action.to, results: planAlternatives(action.from, action.to) });
  if (action?.type === 'food' || action?.type === 'dest') state.explore.destId = action.destId;
  if (action?.type === 'plan') Object.assign(state.plan, { start: action.start, days: action.days, interests: [...action.interests], result: null });
}

async function sendQuestion(raw) {
  const q = raw.trim();
  if (!q || state.chatBusy) return;
  // answer offline in the language the question was typed in
  const qLang = /[一-鿿]/.test(q) && !/[a-z]{3,}/i.test(q) ? 'zh' : 'en';
  const local = askGuide(q, qLang);
  applyAction(local.action);
  state.chat.push({ who: 'me', text: q });

  if (state.aiMode === 'offline') {
    state.chat.push({ who: 'bot', text: local.text, links: placeLinks(local.text) });
    render();
    view.querySelector('#ask-q')?.focus();
    return;
  }

  const bot = { who: 'bot', text: t('thinking'), pending: true };
  state.chat.push(bot);
  state.chatBusy = true;
  render();
  const idx = state.chat.length - 1;
  const history = state.chat.slice(0, -1).filter((m) => !m.pending && !m.greeting);
  const res = await askClaude(history, {
    onText: (text) => {
      bot.text = text;
      const el = document.getElementById(`bubble-${idx}`);
      if (el) { el.textContent = text; el.classList.remove('pending'); }
      const chat = document.getElementById('chat');
      if (chat) chat.scrollTop = chat.scrollHeight;
    },
  });
  bot.pending = false;
  if (!res || res.permanent) {
    state.aiMode = 'offline';
    bot.text = local.text;
  } else if (res.error) {
    bot.text = res.text?.trim() ? `${res.text}\n${t('cutOff')}` : `${res.error === 'rate_limited' ? t('busy') : t('flaky')}\n${local.text}`;
  } else {
    bot.text = res.text;
  }
  bot.links = placeLinks(bot.text);
  state.chatBusy = false;
  render();
  view.querySelector('#ask-q')?.focus();
}

async function runPhoto(file) {
  const p = state.help.photo;
  p.busy = true;
  p.text = t('thinking');
  render();
  const res = await translatePhoto(file, getLang(), {
    onText: (text) => {
      p.text = text;
      const el = document.getElementById('photo-out');
      if (el) { el.className = 'bubble bot'; el.style.cssText = 'margin-top:10px;max-width:100%'; el.textContent = text; }
    },
  });
  p.busy = false;
  p.text = res.text?.trim() ? res.text : t('tryAgain');
  render();
}

async function runPhrase(raw) {
  const text = raw.trim();
  const c = state.help.custom;
  if (!text || c.busy) return;
  c.busy = true;
  c.error = '';
  render();
  const res = await makePhrase(text);
  c.busy = false;
  if (res.card) c.card = res.card; else c.error = t('tryAgain');
  render();
}

view.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action } = el.dataset;

  if (action === 'ask') {
    sendQuestion(el.dataset.q);
  } else if (action === 'show-phrase') {
    const i = el.dataset.i;
    showCard(i === 'custom' ? state.help.custom.card : i === 'tea' ? teaOrder() : PHRASES[Number(i)]);
  } else if (action === 'show-card') {
    const lead = isEn() ? 'Please take me here · 請載我到這裡' : '';
    showCard({ zh: el.dataset.zh, py: lead, en: el.dataset.en });
  } else if (action === 'toggle-interest') {
    const list = el.dataset.group === 'home' ? state.interests : state.plan.interests;
    const i = list.indexOf(el.dataset.key);
    if (i >= 0) list.splice(i, 1); else list.push(el.dataset.key);
    render();
  } else if (action === 'save') {
    const id = el.dataset.id;
    if (isSaved(id)) state.saved = state.saved.filter((s) => s.id !== id);
    else state.saved.push({ id });
    storage.set('saved', state.saved);
    render();
  } else if (action === 'move') {
    const i = state.saved.findIndex((s) => s.id === el.dataset.id);
    const j = i + Number(el.dataset.dir);
    [state.saved[i], state.saved[j]] = [state.saved[j], state.saved[i]];
    storage.set('saved', state.saved);
    render();
  } else if (action === 'make-plan') {
    state.plan.result = generateItinerary(state.plan);
    render();
  } else if (action === 'find-route') {
    state.route.results = state.route.from === state.route.to ? [] : planAlternatives(state.route.from, state.route.to);
    render();
  } else if (action === 'swap') {
    Object.assign(state.route, { from: state.route.to, to: state.route.from, results: null });
    render();
  } else if (action === 'nearby') {
    if (!navigator.geolocation) {
      state.nearby = { error: 'noGeo' };
      render();
      return;
    }
    el.disabled = true;
    el.textContent = t('locating');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        state.nearby = { items: nearbyAttractions(pos.coords.latitude, pos.coords.longitude) };
        render();
      },
      () => {
        state.nearby = { error: 'geoFail' };
        render();
      },
      { timeout: 10000 },
    );
  }
});

render();

getSampler().then((s) => {
  if (state.aiMode === 'checking') state.aiMode = s ? 'ai' : 'offline';
  if (!state.chatBusy) render();
});
getRawSampler().then((raw) => {
  state.help.photo.available = Boolean(raw?.images);
  if (state.tab === 'help') render();
});
