<style>
:root {
  --bg: #f6f7f4;
  --card: #ffffff;
  --text: #1f2a2a;

  --line: #e2e6e2;
  --primary: #0f766e;
  --primary-soft: #d9f0ec;
  --accent: #e2583e;
  --chip: #eef2ef;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111716;
    --card: #1a2221;
    --text: #e7eeec;
    --muted: #9aaaa7;
    --line: #2b3533;
    --primary: #3cbfae;
    --primary-soft: #16332f;
    --accent: #ff7b61;
    --chip: #232d2b;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111716;
  --card: #1a2221;
  --text: #e7eeec;
  --muted: #9aaaa7;
  --line: #2b3533;

  --primary-soft: #16332f;
  --accent: #ff7b61;
  --chip: #232d2b;

}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: baseline; gap: 10px;
  padding: 12px 16px;
  background: var(--primary); color: #fff;
}
.brand { font-weight: 700; font-size: 1.15rem; }
.subtitle { opacity: 0.8; font-size: 0.8rem; }

main { max-width: 760px; margin: 0 auto; padding: 16px; }

h2 { font-size: 1.15rem; margin: 20px 0 10px; }
h3 { font-size: 1rem; margin: 0 0 4px; }
.muted { color: var(--muted); font-size: 0.88rem; }
.small { font-size: 0.8rem; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grid .card { margin: 0; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }

label.field { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
select, input[type="text"], input[type="number"] {
  width: 100%; font: inherit; color: var(--text);
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}

button { font: inherit; cursor: pointer; }
.btn {
  border: 0; border-radius: 10px; padding: 10px 16px;
  background: var(--primary); color: #fff; font-weight: 600;
}
.btn.ghost { background: var(--primary-soft); color: var(--primary); }
.btn.small { padding: 6px 10px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.5; cursor: default; }
.icon-btn { background: none; border: 0; font-size: 1.2rem; padding: 4px; line-height: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--chip); color: var(--text);
  border-radius: 999px; padding: 6px 12px; font-size: 0.88rem;
}
.chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.tag { display: inline-block; font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); margin: 2px 4px 0 0; }

/* 問導遊 */
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px 0; }
.bubble { padding: 10px 12px; border-radius: 14px; white-space: pre-line; max-width: 92%; }
.bubble.bot { background: var(--primary-soft); align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.me { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.ask { display: flex; gap: 8px; margin-top: 10px; }
.ask input { flex: 1; }

/* 交通路線 */
.route-opt { border-left: 4px solid var(--primary); }
.legs { list-style: none; margin: 10px 0 0; padding: 0; }
.leg { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); }
.leg:first-child { border-top: 0; }
.leg .mode { font-size: 1.4rem; text-align: center; }
.transfer { font-size: 0.8rem; color: var(--accent); padding-left: 42px; }
.stat { font-weight: 700; font-size: 1.05rem; }

/* 行程 */
.day h3 { color: var(--primary); }
.timeline { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--primary-soft); }
.timeline li { position: relative; padding: 6px 0 6px 10px; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.timeline li.travel::before { background: var(--accent); }
.timeline li.food::before { background: #f5a524; }

.notice { font-size: 0.8rem; color: var(--muted); background: var(--chip); padding: 8px 12px; border-radius: 10px; margin-top: 12px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
a { color: var(--primary); }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  background: none; border: 0; color: var(--muted);
  padding: 8px 0 10px; font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tabbar button span { font-size: 1.25rem; }
.tabbar button.active { color: var(--primary); font-weight: 700; }

function getDestination(id) {
  return DESTINATIONS.find((d) => d.id === id);
}

// 交通路線規劃:在路網上以 Dijkstra 演算法找出最佳路線。

const TRANSFER_MINUTES = 15; // 每次轉乘預估的等車/步行時間

const STRATEGIES = {
  fastest: { label: '最快', cost: (e, transfer) => e.min + (transfer ? TRANSFER_MINUTES : 0) },
  cheapest: { label: '最省錢', cost: (e, transfer) => e.fare + e.min * 0.1 + (transfer ? 5 : 0) },
  fewest: { label: '最少轉乘', cost: (e, transfer) => e.min + (transfer ? 1000 : 0) },
};

function buildAdjacency(edges) {
  const adj = new Map();
  const add = (from, to, e) => {
    if (!adj.has(from)) adj.set(from, []);
    adj.get(from).push({ ...e, from, to });
  };
  for (const e of edges) {
    add(e.a, e.b, e);
    add(e.b, e.a, e);
  }
  return adj;
}

const ADJ = buildAdjacency(EDGES);

// 搜尋狀態包含「目前所在節點 + 搭乘中的路線」,才能正確計算轉乘成本。
function planRoute(fromId, toId, strategy = 'fastest') {
  if (fromId === toId) return null;
  const strat = STRATEGIES[strategy] ?? STRATEGIES.fastest;
  const key = (node, line) => `${node}|${line ?? ''}`;
  const dist = new Map([[key(fromId, null), 0]]);
  const prev = new Map();
  const queue = [{ node: fromId, line: null, cost: 0 }];

  while (queue.length) {
    queue.sort((x, y) => x.cost - y.cost);
    const cur = queue.shift();
    const curKey = key(cur.node, cur.line);
    if (cur.cost > (dist.get(curKey) ?? Infinity)) continue;
    if (cur.node === toId) return buildResult(curKey, prev, strategy);

    if (cur.node !== fromId && getDestination(cur.node)?.noTransit) continue;
    for (const e of ADJ.get(cur.node) ?? []) {
      const transfer = cur.line !== null && cur.line !== e.line;
      const nextCost = cur.cost + strat.cost(e, transfer);
      const nextKey = key(e.to, e.line);
      if (nextCost < (dist.get(nextKey) ?? Infinity)) {
        dist.set(nextKey, nextCost);
        prev.set(nextKey, { prevKey: curKey, edge: e });
        queue.push({ node: e.to, line: e.line, cost: nextCost });
      }
    }
  }
  return null;
}

function buildResult(endKey, prev, strategy) {
  const raw = [];
  for (let k = endKey; prev.has(k); k = prev.get(k).prevKey) raw.unshift(prev.get(k).edge);

  // 合併同一路線的連續路段
  const legs = [];
  for (const e of raw) {
    const last = legs[legs.length - 1];
    if (last && last.line === e.line) {
      last.to = e.to;
      last.min += e.min;
      last.fare += e.fare;
      last.stops.push(e.to);
      if (e.tip && !last.tips.includes(e.tip)) last.tips.push(e.tip);
    } else {
      legs.push({
        mode: e.mode, line: e.line, name: e.name, from: e.from, to: e.to,
        min: e.min, fare: e.fare, stops: [e.from, e.to], tips: e.tip ? [e.tip] : [],
      });
    }
  }
  const transfers = legs.length - 1;
  return {
    strategy,
    strategyLabel: STRATEGIES[strategy].label,
    legs,
    transfers,
    totalMin: legs.reduce((s, l) => s + l.min, 0) + transfers * TRANSFER_MINUTES,
    totalFare: legs.reduce((s, l) => s + l.fare, 0),
  };
}

// 一次計算三種策略,去除重複的路線
function planAlternatives(fromId, toId) {
  const seen = new Set();
  const results = [];
  for (const s of Object.keys(STRATEGIES)) {
    const r = planRoute(fromId, toId, s);
    if (!r) continue;
    const sig = r.legs.map((l) => `${l.line}:${l.from}>${l.to}`).join(',');
    if (seen.has(sig)) {
      results.find((x) => x.sig === sig).labels.push(r.strategyLabel);
      continue;
    }
    seen.add(sig);
    results.push({ ...r, sig, labels: [r.strategyLabel] });
  }
  return results;
}

// 多點串聯(依序經過每個地點)
function planMultiStop(ids, strategy = 'fastest') {
  const segments = [];
  for (let i = 0; i < ids.length - 1; i++) {
    if (ids[i] === ids[i + 1]) continue;
    const r = planRoute(ids[i], ids[i + 1], strategy);
    segments.push({ from: ids[i], to: ids[i + 1], route: r });
  }
  return segments;
}

function travelMinutes(fromId, toId) {
  if (fromId === toId) return 0;
  return planRoute(fromId, toId, 'fastest')?.totalMin ?? Infinity;
}

function formatDuration(min) {
  const m = Math.round(min);
  if (m < 60) return `${m} 分鐘`;
  const h = Math.floor(m / 60);
  const r = m % 60;
  return r ? `${h} 小時 ${r} 分` : `${h} 小時`;
}

function placeName(id) {
  return getDestination(id)?.name ?? id;
}

// 行程自動規劃:依照興趣、天數、步調,像導遊一樣排出每日行程。

const PACES = {
  relaxed: { label: '悠閒', hours: 5 },
  normal: { label: '一般', hours: 7 },
  packed: { label: '緊湊', hours: 9 },
};

function scoreAttraction(att, interests) {
  const matches = att.tags.filter((t) => interests.includes(t)).length;
  return matches * 3 + (att.popular ? 1 : 0);
}

function isRelevant(att, interests) {
  return interests.length === 0 || att.tags.some((t) => interests.includes(t));
}

function destinationScore(dest, interests, usedIds) {
  return dest.attractions
    .filter((a) => !usedIds.has(a.id) && isRelevant(a, interests))
    .map((a) => scoreAttraction(a, interests))
    .sort((x, y) => y - x)
    .slice(0, 3)
    .reduce((s, x) => s + x, 0);
}

// 推薦景點排行(首頁「導遊推薦」使用)
function recommend(interests, { region, limit = 8 } = {}) {
  const list = [];
  for (const d of DESTINATIONS) {
    if (region && d.region !== region) continue;
    for (const a of d.attractions) {
      if (!isRelevant(a, interests)) continue;
      list.push({ ...a, destId: d.id, destName: d.name, score: scoreAttraction(a, interests) });
    }
  }
  return list.sort((x, y) => y.score - x.score || x.name.localeCompare(y.name, 'zh-Hant')).slice(0, limit);
}

function pickNextDestination(current, interests, usedAtt, visitedDest) {
  let best = null;
  for (const d of DESTINATIONS) {
    if (d.id === current || visitedDest.has(d.id)) continue;
    const score = destinationScore(d, interests, usedAtt);
    if (score <= 0) continue;
    const hrs = travelMinutes(current, d.id) / 60;
    if (!Number.isFinite(hrs)) continue;
    // 分數高、距離近的優先;車程超過 4 小時大幅扣分
    const value = score / (1 + hrs) - (hrs > 4 ? 5 : 0);
    if (!best || value > best.value) best = { id: d.id, value, hrs };
  }
  return best;
}

function pickMeal(dest, interests, usedFoods, hasNightSpot) {
  const foods = dest.foods.filter((f) => !usedFoods.has(`${dest.id}:${f.name}`) && !(hasNightSpot && f.type === '夜市'));
  if (!foods.length) return null;
  const preferMarket = interests.includes('美食') && !hasNightSpot;
  const f = (preferMarket && foods.find((x) => x.type === '夜市')) || foods.find((x) => x.type !== '伴手禮') || foods[0];
  usedFoods.add(`${dest.id}:${f.name}`);
  return f;
}

/**
 * @param {{start:string, days:number, interests:string[], pace?:keyof PACES, returnToStart?:boolean}} opts
 */
function generateItinerary({ start, days, interests = [], pace = 'normal', returnToStart = false }) {
  const dayHours = PACES[pace]?.hours ?? PACES.normal.hours;
  const usedAtt = new Set();
  const usedFoods = new Set();
  const visitedDest = new Set([start]);
  let current = start;
  const plan = [];

  for (let day = 1; day <= days; day++) {
    let hoursLeft = dayHours;
    const items = [];
    const isLastDay = day === days;
    const returnMin = isLastDay && returnToStart ? travelMinutes(current, start) : 0;

    for (let guard = 0; guard < 20; guard++) {
      const dest = getDestination(current);
      const candidates = dest.attractions
        .filter((a) => !a.evening && !usedAtt.has(a.id) && isRelevant(a, interests))
        .sort((x, y) => scoreAttraction(y, interests) - scoreAttraction(x, interests));

      // 預留晚上逛夜市的時間
      const nightReserve = isLastDay && returnToStart ? 0 : Math.max(0, ...dest.attractions
        .filter((a) => a.evening && !usedAtt.has(a.id) && isRelevant(a, interests)).map((a) => a.hours));
      const budget = hoursLeft - nightReserve - (isLastDay && returnToStart ? returnMin / 60 : 0);
      const fit = candidates.find((a) => a.hours <= budget);
      if (fit) {
        usedAtt.add(fit.id);
        hoursLeft -= fit.hours;
        items.push({ type: 'spot', destId: current, destName: dest.name, ...fit });
        continue;
      }
      if (candidates.length > 0 || isLastDay) break; // 今天時間用完,明天繼續

      const next = pickNextDestination(current, interests, usedAtt, visitedDest);
      if (!next) break;
      if (next.hrs > budget && items.length > 0) break; // 車程太長,改到隔天早上出發
      const route = planRoute(current, next.id, 'fastest');
      items.push({ type: 'travel', from: current, to: next.id, route });
      hoursLeft -= route.totalMin / 60;
      visitedDest.add(next.id);
      current = next.id;
    }

    // 夜市等晚上才熱鬧的景點,安排在當天最後
    const here = getDestination(current);
    const night = here.attractions
      .filter((a) => a.evening && !usedAtt.has(a.id) && isRelevant(a, interests))
      .sort((x, y) => scoreAttraction(y, interests) - scoreAttraction(x, interests))[0];
    const leavingTonight = isLastDay && returnToStart && current !== start;
    if (night && !leavingTonight && night.hours <= hoursLeft) {
      usedAtt.add(night.id);
      items.push({ type: 'spot', destId: current, destName: here.name, ...night });
    }

    const meal = pickMeal(here, interests, usedFoods, Boolean(night) || leavingTonight);
    if (meal) items.push({ ...meal, type: 'food', foodType: meal.type, destId: current, destName: here.name });

    if (leavingTonight) {
      items.push({ type: 'travel', from: current, to: start, route: planRoute(current, start, 'fastest') });
      current = start;
    }
    plan.push({ day, items, stayAt: getDestination(current).name });
  }
  return plan;
}

  play: ['玩', '景點', '去哪', '推薦', '好玩', '逛', '看'],
};

const INTEREST_WORDS = {
  室內: ['下雨', '雨天', '室內', '太熱'],
  親子: ['親子', '小孩', '孩子', '小朋友', '家庭'],
  溫泉: ['溫泉', '泡湯'],
  海邊: ['海邊', '海灘', '玩水', '島'],
  登山: ['爬山', '登山', '步道', '健行'],
  夜景: ['夜景', '晚上'],
  老街: ['老街'],
  文化: ['歷史', '古蹟', '文化', '博物館', '廟'],
  自然: ['自然', '風景', '大自然'],
  拍照: ['拍照', '打卡', 'ig', 'IG', '網美'],
  購物: ['購物', '逛街', '買'],
};

function findDestinations(text) {
  const hits = [];
  for (const d of DESTINATIONS) {
    for (const n of [d.name, ...d.aliases]) {
      for (let p = text.indexOf(n); p >= 0; p = text.indexOf(n, p + 1)) {
        hits.push({ id: d.id, start: p, end: p + n.length });
      }
    }
  }
  // 較長的名稱優先(「桃園機場」不應同時被判成「桃園」)
  const kept = hits.filter((h) => !hits.some((o) => o !== h && o.id !== h.id
    && o.start <= h.start && o.end >= h.end && o.end - o.start > h.end - h.start));
  // 依出現順序排列,「從A到B」才能判斷方向
  return kept.sort((x, y) => x.start - y.start).map((h) => h.id).filter((id, i, arr) => arr.indexOf(id) === i);
}

const has = (text, words) => words.some((w) => text.includes(w));

function askGuide(question) {
  const text = question.trim();
  if (!text) return greet();

  const dests = findDestinations(text);
  const region = REGIONS.find((r) => text.includes(r));
  const interests = Object.entries(INTEREST_WORDS).filter(([, ws]) => has(text, ws)).map(([k]) => k);

  // 交通:「從台北到台南怎麼去」
  if (dests.length >= 2 && (has(text, INTENT_WORDS.route) || text.includes('從'))) {
    const [from, to] = dests;
    const routes = planAlternatives(from, to);
    if (!routes.length) return { text: `目前資料庫裡還找不到 ${placeName(from)} 到 ${placeName(to)} 的路線,建議改搭計程車或租車。` };
    const best = routes[0];
    const steps = best.legs.map((l) => `${l.name}(${placeName(l.from)} → ${placeName(l.to)},約 ${formatDuration(l.min)})`).join(' → ');
    return {
      text: `從${placeName(from)}到${placeName(to)},最快的方式是:${steps}。全程約 ${formatDuration(best.totalMin)},票價約 NT$${best.totalFare}。`,
      action: { type: 'route', from, to },
    };
  }

  const dest = dests[0] ? DESTINATIONS.find((d) => d.id === dests[0]) : null;

  // 美食
  if (has(text, INTENT_WORDS.food)) {
    if (dest) {
      const list = dest.foods.slice(0, 5).map((f) => `【${f.type}】${f.name}:${f.desc}`);
      if (!list.length) return { text: `${dest.name}比較少特色小吃,建議回到鄰近市區用餐喔!` };
      return { text: `來${dest.name}一定要試試:\n${list.join('\n')}`, action: { type: 'food', destId: dest.id } };
    }
    const markets = DESTINATIONS.flatMap((d) => d.foods.filter((f) => f.type === '夜市').map((f) => `${f.name}(${d.name})`));
    return { text: `台灣必逛的夜市有:${markets.join('、')}。告訴我你在哪個城市,我可以推薦當地小吃!` };
  }

  // 景點推薦
  if (dest) {
    const picks = recommend(interests, { limit: 50 }).filter((a) => a.destId === dest.id).slice(0, 4);
    const list = (picks.length ? picks : dest.attractions.slice(0, 4)).map((a) => `・${a.name}:${a.desc}`);
    return {
      text: `${dest.intro}\n推薦你去:\n${list.join('\n')}\n\n🚏 在地交通:${dest.localTransport}`,
      action: { type: 'dest', destId: dest.id },
    };
  }

  if (interests.length || region || has(text, INTENT_WORDS.play)) {
    const picks = recommend(interests, { region, limit: 5 });
    if (!picks.length) return { text: '這個條件我暫時找不到適合的景點,換個說法試試看?' };
    const label = interests.map((k) => INTERESTS.find((i) => i.key === k)?.label).join('、');
    const head = `${region ?? '全台'}${label ? `「${label}」` : ''}推薦`;
    return { text: `${head}:\n${picks.map((a) => `・${a.name}(${a.destName}):${a.desc}`).join('\n')}` };
  }

  return greet();
}

function greet() {
  return {
    text: '你好!我是你的台灣小導遊 🧭\n你可以問我:\n・台南有什麼好吃的?\n・從台北到花蓮怎麼去?\n・下雨天台中可以去哪?\n・南部適合親子的景點',
  };
}


function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(lat2 - lat1);
  const dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function nearbyAttractions(lat, lng, limit = 6) {
  return DESTINATIONS.flatMap((d) => d.attractions.map((a) => ({ ...a, destId: d.id, destName: d.name })))
    .map((a) => ({ ...a, km: distanceKm(lat, lng, a.lat, a.lng) }))
    .sort((x, y) => x.km - y.km)
    .slice(0, limit);
}

function nearestDestination(lat, lng) {
  return DESTINATIONS.map((d) => ({ d, km: distanceKm(lat, lng, d.lat, d.lng) })).sort((x, y) => x.km - y.km)[0].d;
}

function mapsUrl(name) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
}

function transitUrl(fromName, toName) {
  const p = new URLSearchParams({ api: '1', origin: fromName, destination: toName, travelmode: 'transit' });
  return `https://www.google.com/maps/dir/?${p}`;
}

};

function destOptions(selected, { withEmpty = false } = {}) {

      .map((d) => `<option value="${d.id}" ${d.id === selected ? 'selected' : ''}>${d.name}</option>`).join('');
    return `<optgroup label="${r}">${opts}</optgroup>`;
  }).join('');
  return (withEmpty ? '<option value="">全部地區</option>' : '') + groups;
}

function render() {
  view.innerHTML = PAGES[state.tab]();
  document.querySelectorAll('.tabbar button').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.tab));
  const chat = document.getElementById('chat');
  if (chat) chat.scrollTop = chat.scrollHeight;
}

function go(tab) {
  state.tab = tab;
  render();
  window.scrollTo(0, 0);
}

// ---------- 事件 ----------
document.querySelector('.tabbar').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]');
  if (b) go(b.dataset.tab);
});

view.addEventListener('change', (e) => {
  const path = e.target.dataset.bind;
  if (!path) return;
  const [a, b] = path.split('.');
  let value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (path === 'plan.days') value = Number(value);
  if (b) state[a][b] = value; else state[a] = value;
  if (path === 'route.to') state.route.results = null;
  render();
});

view.addEventListener('submit', (e) => {
  if (e.target.dataset.form !== 'ask') return;
  e.preventDefault();
  const q = e.target.q.value.trim();
  if (!q) return;
  const ans = askGuide(q);
  state.chat.push({ who: 'me', text: q }, { who: 'bot', text: ans.text });
  if (ans.action?.type === 'route') Object.assign(state.route, { from: ans.action.from, to: ans.action.to, results: planAlternatives(ans.action.from, ans.action.to) });
  if (ans.action?.type === 'food' || ans.action?.type === 'dest') state.explore.destId = ans.action.destId;
  render();
  view.querySelector('input[name=q]')?.focus();
});

view.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action } = el.dataset;

  if (action === 'toggle-interest') {
    const list = el.dataset.group === 'home' ? state.interests : state.plan.interests;
    const i = list.indexOf(el.dataset.key);
    if (i >= 0) list.splice(i, 1); else list.push(el.dataset.key);
    render();
  } else if (action === 'save') {
    const id = el.dataset.id;
    if (isSaved(id)) state.saved = state.saved.filter((s) => s.id !== id);
    else state.saved.push({ id });
    storage.set('saved', state.saved);
    render();
  } else if (action === 'move') {
    const i = state.saved.findIndex((s) => s.id === el.dataset.id);
    const j = i + Number(el.dataset.dir);
    [state.saved[i], state.saved[j]] = [state.saved[j], state.saved[i]];
    storage.set('saved', state.saved);
    render();
  } else if (action === 'make-plan') {
    state.plan.result = generateItinerary(state.plan);
    render();
  } else if (action === 'find-route') {
    state.route.results = state.route.from === state.route.to ? [] : planAlternatives(state.route.from, state.route.to);
    render();
  } else if (action === 'swap') {
    Object.assign(state.route, { from: state.route.to, to: state.route.from, results: null });
    render();
  } else if (action === 'nearby') {
    if (!navigator.geolocation) {
      state.nearby = '<div class="empty">此裝置不支援定位。</div>';
      render();
      return;
    }
    el.disabled = true;
    el.textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        state.nearby = nearbyAttractions(pos.coords.latitude, pos.coords.longitude).map(spotCard).join('');
        render();
      },
      () => {
        state.nearby = '<div class="empty">無法取得位置,請確認已允許定位權限。</div>';
        render();
      },
      { timeout: 10000 },
    );
  }
});

render();


</script>
</body>
</html>
